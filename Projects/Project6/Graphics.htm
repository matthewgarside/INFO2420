<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Native Cooking of Utah</title>

<style type="text/css">


	#thumbs, #image {
		width: 900px;
		text-align: center;
		margin: 0 auto 0 auto;
		color: #000;
	}

	#thumbs {
		margin-top: 10px;
	}

			
	#thumbs img {
		border: solid 1px #000;
		margin: 5px;
	}

	#image{
		height:500px;
	}

	.instructions{
		font-style:italic;
	}

</style>

<script language="JavaScript" type="text/javascript">

	PrintButton1 = new Image
	PrintButton2 = new Image
	logo1 = new Image
	logo2 = new Image
if (document.images) {
	PrintButton1.src = "Images/print1.jpg";
	PrintButton2.src = "Images/print2.jpg";
	logo1.src = "Images/logo1.jpg";
	logo2.src = "Images/logo2.jpg";
}


		var imgArray = new Array(
			'Image1Lg.jpg',
			'Image2Lg.jpg',
			'Image3Lg.jpg',
			'Image4Lg.jpg'
			

		);


		var titleArray = new Array(
    		'Chef Cooking',
    		'Dutch Oven',
    		'Pasta',
    		'Fresh Vegetables'
		);
			
		var imgPath = "Images/fullsize/";
		
		function swapImage(imgID) {

			var theImage = document.getElementById('theImage');
			var textDiv = document.getElementById('bottomText');

			var newImg;
			var textTitle;

			newImg = imgArray[imgID];
			theImage.src = imgPath + newImg;

			textTitle=titleArray[imgID];

      			textDiv.innerHTML = textTitle;
		}
			
		function preloadImages() {		
			for(var i = 0; i < imgArray.length; i++) {
				var tmpImg = new Image;
				tmpImg.src = imgPath + imgArray[i];
			}
		}
		

</script>


</head>
<body  onload="preloadImages()">

<div align="center">

<div>
  <a href="#"
     onclick="return false;"
     onmouseover="document.getElementById('print').src=PrintButton2.src;"
     onmouseout="document.getElementById('print').src=PrintButton1.src;">

    <img src="Images/print1.jpg"
         width="200"
         height="50"
         id="print"
         alt="Print Page">

  </a>
</div>


<div>
    <a href="#"
       onclick="return false;"
       onmouseover="document.getElementById('logo').src=logo2.src;"
       onmouseout="document.getElementById('logo').src=logo1.src;">

        <img src="Images/logo1.jpg"
             id="logo"
             alt="Cooking Pot Logo">

    </a>
</div>

<br />
<br />
<br />
<br />


<div id="thumbs">

    <img src="Images/thumbnails/Image1Sm.jpg"
         alt="Chef Cooking"
         onmouseover="swapImage(0);" />

    <img src="Images/thumbnails/Image2Sm.jpg"
         alt="Dutch Oven"
         onmouseover="swapImage(1);" />

    <img src="Images/thumbnails/Image3Sm.jpg"
         alt="Pasta"
         onmouseover="swapImage(2);" />

    <img src="Images/thumbnails/Image4Sm.jpg"
         alt="Fresh Vegetables"
         onmouseover="swapImage(3);" />

</div>

	<div id="image">

    <img id="theImage"
         src="Images/fullsize/Image1Lg.jpg"
         alt="Chef Cooking"
         width="400"
         height="267" />

    <h3 id="bottomText">Chef Cooking</h3>

</div>

<img src="Images/2colback.jpg"
     width="900"
     height="150"
     alt="Two-column website background">

<br />
<br />
<br />
<br />



</div>

<p>
    <a href="http://validator.w3.org/check?uri=referer"><img
      src="http://www.w3.org/Icons/valid-xhtml10" alt="Valid XHTML 1.0 Transitional" height="31" width="88" /></a>
</p>
  

</body>
</html>
