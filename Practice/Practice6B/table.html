<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>HTML Practice 6 - Tables</title>

<style type="text/css">

.center {
   text-align: center;
}

.schedule {
   margin: auto;
   width: 550px;
}

.caption {
   color: #003300;
   font-weight: bold;
   font-size: 20px;
}

.courses {
   background-color: #CCCCCC;
   width: 25%;
}

.days {
   width: 15%;
}

.dayheading {
   background-color: #99FF66;
}

</style>

</head>

<body>

<div class="center">

   <table class="schedule" border="1" cellspacing="5" cellpadding="5">

      <caption class="caption">My Class Schedule</caption>

      <colgroup class="courses"></colgroup>
      <colgroup class="days" span="5"></colgroup>

      <tr>
         <th>Courses</th>
         <th class="dayheading">Monday</th>
         <th class="dayheading">Tuesday</th>
         <th class="dayheading">Wednesday</th>
         <th class="dayheading">Thursday</th>
         <th class="dayheading">Friday</th>
      </tr>

      <tr>
         <th>INFO 1120</th>
         <td></td>
         <td>9-11</td>
         <td></td>
         <td>9-11</td>
         <td rowspan="2"></td>
      </tr>

      <tr>
         <th>MATH 1010</th>
         <td colspan="4">12-1</td>
      </tr>

      <tr>
         <th>INFO 2420</th>
         <td colspan="5">Online Available 24/7</td>
   </tr>

   </table>

</div>

</body>

</html>
